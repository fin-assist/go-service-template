name: Shared CI self checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared source tests
        run: python3 -B -m unittest discover -s common/tests -p 'test_*.py'
      - name: Actual accepted and rejected linter cases
        run: python3 -B common/probe_lint.py
      - name: Reusable workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck='' -pyflakes=''
