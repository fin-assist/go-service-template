name: Shared service image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      revision:
        description: Full commit SHA of the shared CI source
        required: true
        type: string
      fake_llm:
        required: false
        default: false
        type: boolean
    secrets:
      GO_MODULES_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVICE: ${{ inputs.service }}
      CI_REVISION: ${{ inputs.revision }}
      FAKE_LLM: ${{ inputs.fake_llm }}
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Validate immutable source and image profile
        run: |
          python3 - <<'PY'
          import os
          import re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['CI_REVISION']):
              raise SystemExit('Shared CI revision must be a full commit SHA')
          services = {'service', 'user', 'analytics', 'assistant', 'bank-statement-data', 'bank-bff'}
          if os.environ['SERVICE'] not in services:
              raise SystemExit('Unsupported service image profile')
          if os.environ['FAKE_LLM'] == 'true' and os.environ['SERVICE'] != 'assistant':
              raise SystemExit('fake-llm is supported only for assistant')
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Local and CI pins agree
        run: |
          python3 - <<'PY'
          import json
          import os
          with open('.finassist-ci.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          if manifest['revision'] != os.environ['CI_REVISION']:
              raise SystemExit('Local and CI pins differ')
          PY
      - name: Checkout the pinned shared implementation
        uses: actions/checkout@v4
        with:
          repository: fin-assist/go-service-template
          ref: ${{ inputs.revision }}
          path: .finassist-ci/source
          persist-credentials: false
      - name: Build and smoke-test the images
        id: image
        env:
          GO_MODULES_TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
        run: python3 .finassist-ci/source/common/scripts/image_smoke.py --service "$SERVICE" --fake-llm "$FAKE_LLM"
      - name: Extract stage binary from the tested image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: python3 scripts/stage_artifact.py "$SERVICE" "$IMAGE_TAG" stage-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ inputs.service }}-${{ github.sha }}-linux-amd64
          path: stage-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Extract stage fake provider from its tested image
        if: inputs.fake_llm
        run: python3 scripts/stage_artifact.py fake-llm fake-llm:ci fake-llm-artifact
      - uses: actions/upload-artifact@v4
        if: inputs.fake_llm
        with:
          name: stage-fake-llm-${{ github.sha }}-linux-amd64
          path: fake-llm-artifact/
          retention-days: 30
          if-no-files-found: error
