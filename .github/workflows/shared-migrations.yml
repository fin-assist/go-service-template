name: Shared migration lint

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
      SHARED_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pin
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = os.environ['SHARED_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', pin), 'A full SHA is required'
          assert json.load(open('.finassist-ci.json'))['revision'] == pin, 'Local and CI pins differ'
          PY
      - name: Same immutable SQL and Squawk checks as local development
        run: make lint-migrations BASE_REF="origin/$BASE_REF"
