name: Shared Go lint

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
    secrets:
      GO_MODULES_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/fin-assist/*
      SHARED_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate pin
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = os.environ['SHARED_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', pin), 'A full SHA is required'
          assert json.load(open('.finassist-ci.json'))['revision'] == pin, 'Local and CI pins differ'
          PY
      - name: Access to private modules on trusted pushes only
        env:
          TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/fin-assist/".insteadOf "https://github.com/fin-assist/"
          fi
      - name: Same command and configuration as local development
        run: make lint
